name: Study board CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: study-board-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: students/bondarenko

jobs:
  build:
    name: Build and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Run Docker build and application tests
        run: docker build --platform linux/amd64 --tag "study-board:$GITHUB_SHA" "$PROJECT_DIR"
      - name: Verify the running container
        run: |
          docker run -d --name study-board-ci -p 127.0.0.1:3000:3000 "study-board:$GITHUB_SHA"
          trap 'docker rm -f study-board-ci >/dev/null' EXIT
          curl --retry 8 --retry-connrefused -fsS http://127.0.0.1:3000/healthz | grep -Fx '{"status":"ok"}'
          curl -fsS http://127.0.0.1:3000/ | grep -F '<h1>Навчальні дедлайни</h1>'
      - name: Publish commit image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_TOKEN"
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          image="docker.io/$DOCKER_USERNAME/optima-study-board:$GITHUB_SHA"
          docker tag "study-board:$GITHUB_SHA" "$image"
          docker push "$image"

  deploy:
    name: Provision and deploy to AWS EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_PAGER: ""
      TF_IN_AUTOMATION: "true"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Derive the SSH public key and runner CIDR
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          test -n "$SSH_KEY_B64"
          umask 077
          key="$RUNNER_TEMP/study-board-key"
          printf '%s' "$SSH_KEY_B64" | base64 --decode > "$key"
          public_key=$(ssh-keygen -y -f "$key")
          address=$(curl -4 -fsS --retry 3 --connect-timeout 10 https://checkip.amazonaws.com)
          cidr=$(python3 -c 'import ipaddress, sys; print(f"{ipaddress.IPv4Address(sys.argv[1].strip())}/32")' "$address")
          printf 'TF_VAR_ssh_public_key=%s\nTF_VAR_ssh_cidr=%s\n' "$public_key" "$cidr" >> "$GITHUB_ENV"
      - name: Apply Terraform and read the EC2 address
        id: infra
        working-directory: students/bondarenko/infra
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform init -input=false -no-color -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          terraform validate -no-color
          terraform plan -input=false -no-color -out="$RUNNER_TEMP/study-board.tfplan"
          terraform apply -input=false -no-color "$RUNNER_TEMP/study-board.tfplan"
          printf 'instance_id=%s\n' "$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          printf 'instance_ip=%s\n' "$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify HTTP on port 3000
        env:
          INSTANCE_ID: ${{ steps.infra.outputs.instance_id }}
          INSTANCE_IP: ${{ steps.infra.outputs.instance_ip }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: bash "$PROJECT_DIR/.github/scripts/deploy.sh"
